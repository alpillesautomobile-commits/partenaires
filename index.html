<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpilles Partenaires</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Alpilles">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #1a1a1a; overflow: hidden; }
  #app {
    position: fixed; left: 0; right: 0;
    top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
    width: 100%; height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    border: 0; background: #e0dbd3;
  }
  #chargement {
    position: fixed; inset: 0; display: grid; place-items: center; background: #1a1a1a;
    color: #c8a96e; font: 600 12px ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase;
    transition: opacity .3s;
  }
  #chargement img { width: 96px; height: 96px; display: block; margin: 0 auto 16px; }
  #installer {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    background: #1a1a1a; color: #fafaf8; border-top: 3px solid #c8a96e; padding: 14px 44px 14px 14px;
    font: 14px/1.45 -apple-system, "Segoe UI", Arial, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.35); z-index: 5;
  }
  #installer b { color: #c8a96e; font-weight: 600; }
  #installer button.go {
    margin-top: 10px; background: #c8a96e; color: #1a1a1a; border: 0; padding: 10px 14px;
    font: 600 13px ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; cursor: pointer;
  }
  #installer .x { position: absolute; top: 8px; right: 8px; background: none; border: 0; color: #9a9a94; font-size: 22px; line-height: 1; padding: 6px; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="chargement"><div><img src="icon-192.png" alt="">Alpilles Partenaires</div></div>
<iframe id="app" title="Alpilles Partenaires" allow="clipboard-write"></iframe>
<div id="installer" hidden>
  <button class="x" type="button" aria-label="Fermer">×</button>
  <div id="installer-texte"></div>
  <button class="go" type="button" id="installer-bouton" hidden>Installer l'appli</button>
</div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbzA-bWlIz8OTyCPWXosg-exrHvqruGQUwlLbB6hZfEvgNnFALXQu0twBhgG-d5tGAHP/exec';
  var CLE = 'alp-token';
  var frame = document.getElementById('app');
  var bandeau = document.getElementById('installer');

  function lire() { try { return localStorage.getItem(CLE) || ''; } catch (e) { return ''; } }
  function ecrire(t) { try { localStorage.setItem(CLE, t); } catch (e) {} }
  function oublier() { try { localStorage.removeItem(CLE); } catch (e) {} }
  var valide = function (t) { return /^[a-f0-9]{32}$/.test(t || ''); };

  // L'adresse garde le jeton : « Ajouter à l'écran d'accueil » enregistre ainsi l'espace du vendeur
  function memoriser(t) {
    ecrire(t);
    if (new URLSearchParams(location.search).get('t') !== t) history.replaceState(null, '', '?t=' + t);
  }

  function charger(t) {
    var q = new URLSearchParams(location.search);
    var p = new URLSearchParams({ app: '1' });
    if (valide(t)) p.set('t', t);
    else ['r', 'p'].forEach(function (k) { if (q.get(k)) p.set(k, q.get(k)); });
    frame.src = API + '?' + p.toString();
  }

  var q = new URLSearchParams(location.search);
  var t = q.get('t');
  if (valide(t)) ecrire(t); else { t = lire(); if (valide(t)) history.replaceState(null, '', '?t=' + t); }
  charger(t);
  frame.addEventListener('load', function () {
    var c = document.getElementById('chargement');
    c.style.opacity = '0'; setTimeout(function () { c.hidden = true; }, 300);
  });

  // Messages envoyés par l'appli (page Google Apps Script affichée dans le cadre)
  window.addEventListener('message', function (e) {
    var o = String(e.origin || '');
    if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o) && o !== 'https://script.google.com') return;
    var m = e.data || {};
    if (m.type === 'alp-token' && valide(m.token)) { memoriser(m.token); proposerInstallation(); }
    else if (m.type === 'alp-open' && valide(m.token)) { memoriser(m.token); charger(m.token); }
    else if (m.type === 'alp-forget') { oublier(); history.replaceState(null, '', location.pathname); }
  });

  // Bandeau « Installer l'appli » quand la page est ouverte dans le navigateur
  var installee = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var invite = null;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); invite = e; proposerInstallation(); });

  function proposerInstallation() {
    if (installee || !valide(lire())) return;
    try { if (localStorage.getItem('alp-bandeau-ferme') === '1') return; } catch (e) {}
    var txt = document.getElementById('installer-texte');
    var btn = document.getElementById('installer-bouton');
    if (ios) {
      txt.innerHTML = '<b>Gardez l\'appli sur votre iPhone.</b><br>Touchez le bouton Partager <span aria-hidden="true">⬆︎</span> en bas de Safari, puis « Sur l\'écran d\'accueil ».';
      btn.hidden = true;
    } else if (invite) {
      txt.innerHTML = '<b>Gardez l\'appli sur votre téléphone.</b><br>Une icône Alpilles s\'ajoute à votre écran d\'accueil.';
      btn.hidden = false;
    } else {
      txt.innerHTML = '<b>Gardez l\'appli sur votre téléphone.</b><br>Ouvrez le menu ⋮ du navigateur, puis « Ajouter à l\'écran d\'accueil ».';
      btn.hidden = true;
    }
    bandeau.hidden = false;
  }
  document.getElementById('installer-bouton').addEventListener('click', function () {
    if (!invite) return;
    invite.prompt();
    invite.userChoice.then(function () { invite = null; bandeau.hidden = true; });
  });
  bandeau.querySelector('.x').addEventListener('click', function () {
    bandeau.hidden = true;
    try { localStorage.setItem('alp-bandeau-ferme', '1'); } catch (e) {}
  });
  setTimeout(proposerInstallation, 2500);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
